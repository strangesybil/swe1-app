dist: jammy
language: python
python:
  - "3.9"

install:
  - pip install -r requirements.txt

script:
  - black --check .
  - flake8
  - coverage run manage.py test

after_success:
  - coveralls

deploy:
  provider: elasticbeanstalk
  edge: true
  region: us-east-2
  app: swe1-app
  env: swe1-app-env
    global:
      - COVERALLS_SERVICE_NAME=travis-pro
  bucket: elasticbeanstalk-us-east-2-382187823280 
  on:
    branch: main